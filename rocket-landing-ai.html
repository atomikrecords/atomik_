<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rocket Landing AI</title>
<style>
  :root{
    --bg1:#050611; --bg2:#0c1024; --panel:#12142280; --panel-solid:#141726;
    --ink:#eef0fb; --sub:#8d92b8; --line:#2a2e48; --accent:#4fd1ff; --accent2:#7c5cff;
    --good:#3ee08b; --bad:#ff5c7a; --warn:#ffb347;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{color:var(--ink); touch-action:none; overscroll-behavior:none; user-select:none;
    height:100dvh; width:100vw;}
  #wrap{position:relative; width:100%; height:100dvh; display:flex; flex-direction:column;}
  #canvasHolder{position:relative; flex:1 1 auto; min-height:0; background:#000;}
  canvas{display:block; width:100%; height:100%;}

  /* Everything overlaid on the canvas stacks in normal document flow inside
     this single column, so nothing can ever overlap regardless of how the
     chip row wraps on a narrow phone. */
  .topOverlay{
    position:absolute; top:0; left:0; right:0;
    padding: calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);
    display:flex; flex-direction:column; gap:6px; pointer-events:none;
  }
  .hudRow{display:flex; flex-wrap:wrap; gap:6px; justify-content:space-between; align-items:flex-start;}
  .chipRow{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--panel); backdrop-filter: blur(8px);
    border:1px solid var(--line); border-radius:10px; padding:5px 9px;
    font-size:11.5px; line-height:1.25; color:var(--sub); min-width:70px;
  }
  .chip[hidden]{display:none;}
  .chip b{display:block; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .chip.accent b{color:var(--accent);}
  .chip.good b{color:var(--good);}
  .chip.bad b{color:var(--bad);}
  .controls{display:flex; gap:6px; align-items:center; pointer-events:auto; flex:0 0 auto;}
  .learning-pill{
    display:flex; align-items:center; gap:6px; background:linear-gradient(135deg,#4fd1ff22,#7c5cff22);
    border:1px solid #7c5cff55; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600;
    color:var(--accent); white-space:nowrap;
  }
  .learning-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good);
    box-shadow:0 0 8px var(--good); animation:pulse 1.1s ease-in-out infinite;}
  .learning-pill.paused .dot{background:var(--warn); box-shadow:0 0 8px var(--warn); animation:none;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.75);}}

  .gearBtn{
    flex:0 0 auto; min-height:0; padding:6px 10px; font-size:15px; border-radius:999px;
    background:var(--panel); backdrop-filter: blur(8px); border:1px solid var(--line); color:var(--ink);
  }
  .boosterHud{
    align-self:flex-start; display:flex; flex-direction:column; gap:4px; pointer-events:none;
    background:var(--panel); backdrop-filter: blur(8px); border:1px solid var(--line);
    border-radius:10px; padding:7px 9px;
  }
  .boosterHud[hidden]{display:none;}
  .bmeter{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--sub);}
  .bmeter span{width:26px; font-weight:700; letter-spacing:.03em;}
  .bmeter b{width:30px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums;}
  .bbar{width:56px; height:6px; border-radius:4px; background:#252a45; overflow:hidden;}
  .bbar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:4px; transition:width .08s linear;}
  .bmeter.firing .bbar i{background:linear-gradient(90deg,#ffb347,#ff5c7a);}
  .bmeter.firing b{color:var(--warn);}

  .banner{
    position:absolute; left:50%; top:26%; transform:translate(-50%,-10px);
    padding:10px 22px; border-radius:14px; font-size:16px; font-weight:800; letter-spacing:.02em;
    opacity:0; transition:opacity .18s ease, transform .18s ease; pointer-events:none; text-align:center;
    box-shadow:0 8px 30px #0008;
  }
  .banner.show{opacity:1; transform:translate(-50%,0);}
  .banner.success{background:linear-gradient(135deg,#1c3,#3ee08b); color:#03150a;}
  .banner.crash{background:linear-gradient(135deg,#a11,#ff5c7a); color:#2a0006;}

  .settingsPanel{
    position:absolute; right:calc(env(safe-area-inset-right,0px) + 10px);
    background:var(--panel-solid); border:1px solid var(--line); border-radius:12px; padding:12px;
    width:210px; box-shadow:0 12px 30px #000a; z-index:5;
  }
  .settingsTitle{font-weight:700; font-size:13px; margin-bottom:8px;}
  .settingRow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink); padding:6px 0;}
  .settingRow input{width:16px; height:16px;}
  #settingsPanel button{width:100%; min-height:36px;}

  #bottom{
    flex:0 0 auto; background:var(--panel-solid); border-top:1px solid var(--line);
    padding: 8px calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 10px);
    display:flex; flex-direction:column; gap:8px;
  }
  .row{display:flex; gap:8px; align-items:stretch;}
  button{
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
    background:#1b1e33; border:1px solid var(--line); border-radius:10px;
    padding:10px 8px; flex:1 1 0; min-height:42px; letter-spacing:.01em;
  }
  button:active{background:#262a48;}
  button.primary{background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#03101c; border:none;}
  button.danger{background:#3a1420; border-color:#5c2436; color:var(--bad);}
  .speedgrp{display:flex; gap:6px; flex:1.4 1 0;}
  .speedgrp button{flex:1; padding:10px 4px;}
  .speedgrp button.active{background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#03101c; border:none;}

  #progress{
    display:flex; align-items:center; gap:10px; font-size:11px; color:var(--sub); flex-wrap:wrap;
  }
  #progress .title{font-weight:700; color:var(--ink); font-size:12px; white-space:nowrap;}
  #sparkWrap{flex:1 1 160px; min-width:120px; height:30px; position:relative;}
  #sparkWrap canvas{width:100%; height:100%; display:block;}
  #progress .stat{white-space:nowrap;}
  #progress .stat b{color:var(--ink);}
</style>
</head>
<body>
<div id="wrap">
  <div id="canvasHolder">
    <canvas id="c"></canvas>
    <div class="topOverlay" id="topOverlay">
      <div class="hudRow">
        <div class="chipRow">
          <div class="chip"><span>Attempt</span><b id="statAttempt">0</b></div>
          <div class="chip good"><span>Landings</span><b id="statSuccess">0</b></div>
          <div class="chip accent"><span>Success rate</span><b id="statRate">0%</b></div>
          <div class="chip"><span>Reward</span><b id="statReward">0</b></div>
          <div class="chip" id="fuelChip"><span>Fuel</span><b id="statFuel">100%</b></div>
        </div>
        <div class="controls">
          <div class="learning-pill" id="learnPill"><span class="dot"></span><span id="learnLabel">Learning…</span></div>
          <button id="btnSettings" class="gearBtn">⚙</button>
        </div>
      </div>
      <div id="boosterHud" class="boosterHud">
        <div class="bmeter" data-b="bottom"><span>BTM</span><div class="bbar"><i></i></div><b>0%</b></div>
        <div class="bmeter" data-b="top"><span>TOP</span><div class="bbar"><i></i></div><b>0%</b></div>
        <div class="bmeter" data-b="left"><span>LFT</span><div class="bbar"><i></i></div><b>0%</b></div>
        <div class="bmeter" data-b="right"><span>RGT</span><div class="bbar"><i></i></div><b>0%</b></div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div id="settingsPanel" class="settingsPanel" hidden>
      <div class="settingsTitle">Settings</div>
      <label class="settingRow"><input type="checkbox" id="optBoosterPct" checked> Show booster power %</label>
      <label class="settingRow"><input type="checkbox" id="optTrail" checked> Show trajectory trail</label>
      <label class="settingRow"><input type="checkbox" id="optFuel" checked> Show fuel gauge</label>
      <label class="settingRow"><input type="checkbox" id="optInfiniteFuel"> Infinite fuel</label>
      <button id="btnCloseSettings" style="margin-top:6px;">Close</button>
    </div>
  </div>
  <div id="bottom">
    <div id="progress">
      <span class="title">AI Learning Progress</span>
      <div id="sparkWrap"><canvas id="spark"></canvas></div>
      <span class="stat">best <b id="statBest">0</b></span>
      <span class="stat">avg(20) <b id="statAvg">0</b></span>
      <span class="stat">difficulty <b id="statDiff">0%</b></span>
      <span class="stat">gen <b id="statGen">0</b></span>
    </div>
    <div class="row">
      <button class="primary" id="btnRun">Start</button>
      <button class="danger" id="btnReset">Reset Learning</button>
    </div>
    <div class="row">
      <span style="align-self:center; font-size:11px; color:var(--sub); flex:0 0 auto;">Speed</span>
      <div class="speedgrp">
        <button data-spd="1" class="active">1x</button>
        <button data-spd="5">5x</button>
        <button data-spd="25">25x</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   CONFIG / CONSTANTS
   ========================================================================= */
const WORLD = { w: 1400, h: 1100, groundY: 980 };
const START = { x: 300, y: 140 };

// Curriculum: the pad starts close to the rocket (easy) and is pushed
// farther away as the AI's rolling success rate improves, then pulled back
// in if it starts failing too much. This turns "stumble into a rare accidental
// win" into "win often early, then get gradually challenged" - the single
// biggest lever for how fast visible improvement shows up.
const PAD_OFFSET_MIN = 150, PAD_OFFSET_MAX = 520, PAD_WIDTH = 140;
const PAD = { x1: 0, x2: 0, y: WORLD.groundY };

const GRAVITY = 175;                 // px/s^2
const MAIN_THRUST = 340;             // bottom booster accel
const TOP_THRUST = 220;              // top booster accel
const SIDE_THRUST = 200;             // left/right lateral accel
const SIDE_TORQUE = 3.4;             // left/right angular accel (rad/s^2)
const ANG_DAMP = 0.992;
const FUEL_MAX = 100;
const FUEL_RATE = 7;                 // per booster active, per second
const ROCKET_W = 26, ROCKET_H = 62;
const MAX_TILT = Math.PI * 0.62;     // ~112 deg -> flip crash
const LAND_TILT_OK = 0.4;            // ~23 deg
const LAND_SPEED_OK = 130;           // px/s
const LAND_ANGVEL_OK = 1.3;
const MAX_STEPS = 900;               // episode cap (~15s at 60 physics-steps/s)
const DT = 1/60;

/* =========================================================================
   NEURAL NET: a small 2-hidden-layer actor-critic, trained with a
   simplified PPO (clipped policy gradient + GAE advantages), fed by many
   simultaneous simulated rockets and periodically replaying rare wins.
   ========================================================================= */
// Two independent categorical booster groups keep the action space small and
// low-variance while still letting every booster be driven on its own:
//   axial group   -> {none, bottom, top}   (fights gravity / brakes)
//   lateral group -> {none, left, right}   (steers toward the pad)
// State also includes the last action taken (short-term memory), which
// helps the policy reason about momentum/lag rather than react blindly.
const IN = 12, H1 = 32, H2 = 24, GROUPN = 3, OUT = GROUPN*2;
const LR = 0.012;
const GAMMA = 0.98;
const LAMBDA = 0.95;                 // GAE smoothing between 1-step TD and full Monte-Carlo
const ENTROPY_COEF = 0.015;
const GRAD_CLIP_NORM = 6;
const RETURN_SCALE = 60;             // compresses raw rewards into a ~unit range for the critic
const CRITIC_COEF = 1.0;
const CLIP_EPS = 0.2;                // PPO trust-region: block updates once a policy has drifted too far
const PPO_EPOCHS = 2;                // re-use each batch of experience this many times
const BATCH_MIN_STEPS = 1500;        // collect roughly this many steps before each PPO update
const SUCCESS_BUFFER_SIZE = 12;      // replay memory of rare successful landings
const REPLAY_PER_BATCH = 2;          // how many stored successes get replayed into each update
const NUM_WORKERS = 4;               // simultaneous simulated rockets (only worker 0 is drawn)

function randn(){ // Box-Muller
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function makeMat(r,c,scale){ const m=new Array(r); for(let i=0;i<r;i++){ m[i]=new Float64Array(c); for(let j=0;j<c;j++) m[i][j]=scale?randn()*scale:0; } return m; }
function makeVec(n){ return new Float64Array(n); }

function freshNet(){
  return {
    W1: makeMat(IN, H1, 1/Math.sqrt(IN)), b1: makeVec(H1),
    W2: makeMat(H1, H2, 1/Math.sqrt(H1)), b2: makeVec(H2),
    W3: makeMat(H2, OUT, 1/Math.sqrt(H2)), b3: makeVec(OUT),
    Wv: makeVec(H2), bv: 0
  };
}

let net = freshNet();
let gen = 0; // generation counter (network resets)

function softmax3(z, off){
  const m = Math.max(z[off],z[off+1],z[off+2]);
  const e0=Math.exp(z[off]-m), e1=Math.exp(z[off+1]-m), e2=Math.exp(z[off+2]-m);
  const s=e0+e1+e2;
  return [e0/s, e1/s, e2/s];
}

// forward pass; returns {h1,h2 (post-tanh activations), p (6 probs), v (state value)}
function forward(x){
  const h1 = new Float64Array(H1);
  for(let j=0;j<H1;j++){
    let s = net.b1[j];
    for(let i=0;i<IN;i++) s += x[i]*net.W1[i][j];
    h1[j] = Math.tanh(s);
  }
  const h2 = new Float64Array(H2);
  for(let j=0;j<H2;j++){
    let s = net.b2[j];
    for(let i=0;i<H1;i++) s += h1[i]*net.W2[i][j];
    h2[j] = Math.tanh(s);
  }
  const z = new Float64Array(OUT);
  for(let k=0;k<OUT;k++){
    let s = net.b3[k];
    for(let j=0;j<H2;j++) s += h2[j]*net.W3[j][k];
    z[k]=s;
  }
  const pAxial = softmax3(z,0);
  const pLateral = softmax3(z,GROUPN);
  const p = Float64Array.from([...pAxial, ...pLateral]);
  let v = net.bv;
  for(let j=0;j<H2;j++) v += net.Wv[j]*h2[j];
  return {h1,h2,p,v};
}

function sampleCategorical(p3){
  const r = Math.random();
  if(r < p3[0]) return 0;
  if(r < p3[0]+p3[1]) return 1;
  return 2;
}

// returns {choice:[axialIdx,lateralIdx], booster:[bottom,top,left,right]}
function sampleActions(p){
  const axial = sampleCategorical([p[0],p[1],p[2]]);
  const lateral = sampleCategorical([p[3],p[4],p[5]]);
  const booster = new Uint8Array(4); // bottom, top, left, right
  if(axial===1) booster[0]=1; else if(axial===2) booster[1]=1;
  if(lateral===1) booster[2]=1; else if(lateral===2) booster[3]=1;
  return { choice:[axial,lateral], booster };
}

function zeroGrads(){
  return {
    W1: makeMat(IN,H1,0), b1: makeVec(H1),
    W2: makeMat(H1,H2,0), b2: makeVec(H2),
    W3: makeMat(H2,OUT,0), b3: makeVec(OUT),
    Wv: makeVec(H2), bv: 0
  };
}

// backprop a single sample's policy+value gradient (dz: dLoss/dPolicyLogits,
// dv: dLoss/dValueOutput) into the shared gradient accumulator
function accumGrad(g, x, h1, h2, dz, dv){
  for(let j=0;j<H2;j++) for(let k=0;k<OUT;k++) g.W3[j][k] += h2[j]*dz[k];
  for(let k=0;k<OUT;k++) g.b3[k] += dz[k];
  for(let j=0;j<H2;j++) g.Wv[j] += h2[j]*dv;
  g.bv += dv;

  const dh2 = new Float64Array(H2);
  for(let j=0;j<H2;j++){
    let s=0;
    for(let k=0;k<OUT;k++) s += net.W3[j][k]*dz[k];
    s += net.Wv[j]*dv;
    dh2[j] = s*(1-h2[j]*h2[j]);
  }
  for(let i=0;i<H1;i++) for(let j=0;j<H2;j++) g.W2[i][j] += h1[i]*dh2[j];
  for(let j=0;j<H2;j++) g.b2[j] += dh2[j];

  const dh1 = new Float64Array(H1);
  for(let i=0;i<H1;i++){
    let s=0;
    for(let j=0;j<H2;j++) s += net.W2[i][j]*dh2[j];
    dh1[i] = s*(1-h1[i]*h1[i]);
  }
  for(let i=0;i<IN;i++) for(let j=0;j<H1;j++) g.W1[i][j] += x[i]*dh1[j];
  for(let j=0;j<H1;j++) g.b1[j] += dh1[j];
}

function applyGrads(g){
  let gnorm2 = 0;
  for(let i=0;i<IN;i++) for(let j=0;j<H1;j++) gnorm2 += g.W1[i][j]*g.W1[i][j];
  for(let j=0;j<H1;j++) gnorm2 += g.b1[j]*g.b1[j];
  for(let i=0;i<H1;i++) for(let j=0;j<H2;j++) gnorm2 += g.W2[i][j]*g.W2[i][j];
  for(let j=0;j<H2;j++) gnorm2 += g.b2[j]*g.b2[j];
  for(let j=0;j<H2;j++) for(let k=0;k<OUT;k++) gnorm2 += g.W3[j][k]*g.W3[j][k];
  for(let k=0;k<OUT;k++) gnorm2 += g.b3[k]*g.b3[k];
  for(let j=0;j<H2;j++) gnorm2 += g.Wv[j]*g.Wv[j];
  gnorm2 += g.bv*g.bv;
  const gnorm = Math.sqrt(gnorm2);
  const scale = LR * (gnorm > GRAD_CLIP_NORM ? GRAD_CLIP_NORM/gnorm : 1);

  for(let i=0;i<IN;i++) for(let j=0;j<H1;j++) net.W1[i][j] -= scale*g.W1[i][j];
  for(let j=0;j<H1;j++) net.b1[j] -= scale*g.b1[j];
  for(let i=0;i<H1;i++) for(let j=0;j<H2;j++) net.W2[i][j] -= scale*g.W2[i][j];
  for(let j=0;j<H2;j++) net.b2[j] -= scale*g.b2[j];
  for(let j=0;j<H2;j++) for(let k=0;k<OUT;k++) net.W3[j][k] -= scale*g.W3[j][k];
  for(let k=0;k<OUT;k++) net.b3[k] -= scale*g.b3[k];
  for(let j=0;j<H2;j++) net.Wv[j] -= scale*g.Wv[j];
  net.bv -= scale*g.bv;
}

// Generalized Advantage Estimation for one completed episode's trajectory.
// Blends short-horizon TD error with full-episode Monte-Carlo return for a
// much less noisy credit-assignment signal than raw discounted returns.
function computeGAE(traj){
  const T = traj.r.length;
  const adv = new Float64Array(T);
  let lastGae = 0;
  for(let t=T-1;t>=0;t--){
    const vNext = (t+1<T) ? traj.v[t+1] : 0; // episode always truly terminates - no bootstrap needed
    const rScaled = traj.r[t]/RETURN_SCALE;
    const delta = rScaled + GAMMA*vNext - traj.v[t];
    lastGae = delta + GAMMA*LAMBDA*lastGae;
    adv[t] = lastGae;
  }
  const ret = new Float64Array(T);
  for(let t=0;t<T;t++) ret[t] = adv[t] + traj.v[t];
  return {adv, ret};
}

// Pending batch of completed episodes (collected across all parallel workers)
// plus a small replay memory of rare successful landings.
let pendingBatch = [];
let pendingBatchSteps = 0;
let successBuffer = [];

function pushSuccessBuffer(record){
  successBuffer.push(record);
  if(successBuffer.length > SUCCESS_BUFFER_SIZE) successBuffer.shift();
}

// Simplified PPO update: clipped surrogate policy objective + value
// regression + entropy bonus, run for a few epochs over the same batch
// (each pass reuses the collected experience instead of throwing it away
// after a single gradient step, which is a big sample-efficiency win),
// with a couple of replayed past successes folded in each time so rare
// wins get reinforced more than once.
function runPpoUpdate(){
  const episodes = pendingBatch.slice();
  for(let i=0;i<REPLAY_PER_BATCH && successBuffer.length>0;i++){
    episodes.push(successBuffer[Math.floor(Math.random()*successBuffer.length)]);
  }

  let allAdv = [];
  episodes.forEach(e=>{ for(let t=0;t<e.adv.length;t++) allAdv.push(e.adv[t]); });
  let mean=0; allAdv.forEach(v=>mean+=v); mean/=allAdv.length;
  let varr=0; allAdv.forEach(v=>varr+=(v-mean)*(v-mean)); varr/=allAdv.length;
  const std = Math.sqrt(varr)+1e-6;
  episodes.forEach(e=>{ e.advNorm = e.adv.map(v=>(v-mean)/std); });

  for(let epoch=0; epoch<PPO_EPOCHS; epoch++){
    const g = zeroGrads();
    for(const e of episodes){
      for(let t=0;t<e.x.length;t++){
        const x=e.x[t], choice=e.choice[t], pOld=e.pOld[t], A=e.advNorm[t], ret=e.ret[t];
        const {h1,h2,p:pNew,v:vNew} = forward(x);

        const oldLogP = Math.log(pOld[choice[0]]+1e-8) + Math.log(pOld[GROUPN+choice[1]]+1e-8);
        const newLogP = Math.log(pNew[choice[0]]+1e-8) + Math.log(pNew[GROUPN+choice[1]]+1e-8);
        const ratio = Math.exp(newLogP-oldLogP);

        // PPO clip: once the policy has moved far enough that the ratio
        // leaves the trust region in the direction the advantage favors,
        // the gradient is cut to zero - this is what stops one lucky/unlucky
        // batch from destructively overwriting everything learned so far.
        let scale;
        if(A>=0) scale = (ratio > 1+CLIP_EPS) ? 0 : A*ratio;
        else scale = (ratio < 1-CLIP_EPS) ? 0 : A*ratio;

        const dz = new Float64Array(OUT);
        for(let k=0;k<GROUPN;k++){
          const oh = (k===choice[0])?1:0;
          dz[k] = scale*(pNew[k]-oh) - ENTROPY_COEF*(1/GROUPN - pNew[k]);
        }
        for(let k=0;k<GROUPN;k++){
          const oh = (k===choice[1])?1:0;
          dz[GROUPN+k] = scale*(pNew[GROUPN+k]-oh) - ENTROPY_COEF*(1/GROUPN - pNew[GROUPN+k]);
        }
        const dv = (vNew-ret)*CRITIC_COEF;
        accumGrad(g, x, h1, h2, dz, dv);
      }
    }
    applyGrads(g);
  }
}

/* =========================================================================
   CURRICULUM
   ========================================================================= */
let difficulty = 0;
let curriculumWindow = [];

function recomputePad(){
  const offset = PAD_OFFSET_MIN + difficulty*(PAD_OFFSET_MAX-PAD_OFFSET_MIN);
  const cx = START.x + offset;
  PAD.x1 = cx - PAD_WIDTH/2;
  PAD.x2 = cx + PAD_WIDTH/2;
}

function updateCurriculum(success){
  curriculumWindow.push(success?1:0);
  if(curriculumWindow.length>40) curriculumWindow.shift();
  if(curriculumWindow.length>=20){
    const rate = curriculumWindow.reduce((a,b)=>a+b,0)/curriculumWindow.length;
    if(rate>=0.35 && difficulty<1){
      difficulty = Math.min(1, difficulty+0.05);
      curriculumWindow = [];
      recomputePad();
    } else if(rate<0.04 && difficulty>0){
      difficulty = Math.max(0, difficulty-0.02);
      curriculumWindow = [];
      recomputePad();
    }
  }
}

/* =========================================================================
   PERSISTENCE
   ========================================================================= */
const LS_KEY = "rocketLandingAI_v2"; // v2: bigger net + curriculum - incompatible with v1 saves

function matToArr(m){ return m.map(row=>Array.from(row)); }
function arrToMat(a){ return a.map(row=>Float64Array.from(row)); }

let lastSaveAt = 0;
function saveAll(force){
  const now = Date.now();
  if(!force && now-lastSaveAt < 2000) return; // throttle - avoid hammering localStorage at high sim speeds
  lastSaveAt = now;
  try{
    const payload = {
      net: {
        W1: matToArr(net.W1), b1: Array.from(net.b1),
        W2: matToArr(net.W2), b2: Array.from(net.b2),
        W3: matToArr(net.W3), b3: Array.from(net.b3),
        Wv: Array.from(net.Wv), bv: net.bv
      },
      gen, attempts, successes, rewardHistory: rewardHistory.slice(-300), best, speed, difficulty
    };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
  }catch(e){ /* storage full or unavailable - ignore */ }
}
function loadAll(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const p = JSON.parse(raw);
    net = {
      W1: arrToMat(p.net.W1), b1: Float64Array.from(p.net.b1),
      W2: arrToMat(p.net.W2), b2: Float64Array.from(p.net.b2),
      W3: arrToMat(p.net.W3), b3: Float64Array.from(p.net.b3),
      Wv: Float64Array.from(p.net.Wv), bv: p.net.bv||0
    };
    gen = p.gen||0;
    attempts = p.attempts||0;
    successes = p.successes||0;
    rewardHistory = p.rewardHistory||[];
    best = p.best||-Infinity;
    difficulty = p.difficulty||0;
    if(p.speed===1||p.speed===5||p.speed===25) speed = p.speed;
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   ENVIRONMENT / PHYSICS
   ========================================================================= */
function newRocket(){
  return {
    x: START.x, y: START.y,
    vx: (Math.random()-0.5)*20, vy: 0,
    angle: (Math.random()-0.5)*0.2,
    angVel: 0,
    fuel: FUEL_MAX,
    boosters: {bottom:0, top:0, left:0, right:0},
    lastAction: [0,0,0,0],
    alive: true
  };
}

function padCenter(){ return { x:(PAD.x1+PAD.x2)/2, y:PAD.y }; }

function getState(r){
  const pc = padCenter();
  const dx = (pc.x - r.x)/900;
  const dy = (pc.y - r.y)/900;
  const vx = r.vx/400;
  const vy = r.vy/400;
  const s = Math.sin(r.angle), c = Math.cos(r.angle);
  const av = r.angVel/6;
  const fuel = (r.fuel/FUEL_MAX)*2-1;
  const la = r.lastAction;
  return Float64Array.from([dx,dy,vx,vy,s,c,av,fuel, la[0]?1:-1, la[1]?1:-1, la[2]?1:-1, la[3]?1:-1]);
}

function rocketCorners(r){
  const hw=ROCKET_W/2, hh=ROCKET_H/2;
  const c=Math.cos(r.angle), s=Math.sin(r.angle);
  const pts=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  return pts.map(([lx,ly])=>({
    x: r.x + lx*c - ly*s,
    y: r.y + lx*s + ly*c
  }));
}

// returns {done, success, reason}
function physicsStep(r, booster){
  r.boosters.bottom = booster[0]; r.boosters.top = booster[1];
  r.boosters.left = booster[2]; r.boosters.right = booster[3];

  const activeCount = booster[0]+booster[1]+booster[2]+booster[3];
  const fuelAvail = r.fuel>0?1:0;
  const bOn = booster[0]*fuelAvail, tOn=booster[1]*fuelAvail, lOn=booster[2]*fuelAvail, rOn=booster[3]*fuelAvail;

  const Fx = Math.sin(r.angle), Fy = -Math.cos(r.angle);   // local "up"/nose direction
  const Rx = Math.cos(r.angle), Ry = Math.sin(r.angle);    // local "right"

  const axial = bOn*MAIN_THRUST - tOn*TOP_THRUST;
  const lateral = lOn*SIDE_THRUST - rOn*SIDE_THRUST;

  const ax = Fx*axial + Rx*lateral;
  const ay = Fy*axial + Ry*lateral + GRAVITY;

  const angAccel = (rOn - lOn)*SIDE_TORQUE;

  r.vx += ax*DT; r.vy += ay*DT;
  r.x += r.vx*DT; r.y += r.vy*DT;
  r.angVel += angAccel*DT; r.angVel *= ANG_DAMP;
  r.angle += r.angVel*DT;

  if(!settings.infiniteFuel) r.fuel = Math.max(0, r.fuel - activeCount*FUEL_RATE*DT);
  r.lastAction = booster;

  // invisible side walls: clamp rather than end the episode, so a wide swing
  // doesn't waste the whole attempt before it ever reaches the ground
  if(r.x < 20){ r.x = 20; if(r.vx<0) r.vx = 0; }
  else if(r.x > WORLD.w-20){ r.x = WORLD.w-20; if(r.vx>0) r.vx = 0; }

  // flip crash
  if(Math.abs(r.angle) > MAX_TILT){
    return {done:true, success:false, reason:"tumbled"};
  }

  const corners = rocketCorners(r);
  const lowestY = Math.max(...corners.map(p=>p.y));
  const cxs = corners.map(p=>p.x);
  const minX = Math.min(...cxs), maxX = Math.max(...cxs);

  if(lowestY >= WORLD.groundY){
    const onPad = (minX >= PAD.x1-4 && maxX <= PAD.x2+4);
    const speed = Math.hypot(r.vx, r.vy);
    const upright = Math.abs(r.angle) <= LAND_TILT_OK;
    const slow = speed <= LAND_SPEED_OK;
    const stable = Math.abs(r.angVel) <= LAND_ANGVEL_OK;
    if(onPad && upright && slow && stable){
      return {done:true, success:true, reason:"landed"};
    }
    return {done:true, success:false, reason: onPad?"hard landing":"missed pad"};
  }
  return {done:false};
}

function computeReward(w, stepResult){
  const r = w.rocket;
  // horizontal distance to the pad's own footprint (0 once directly above it)
  const hdist = r.x < PAD.x1 ? (PAD.x1-r.x) : (r.x > PAD.x2 ? (r.x-PAD.x2) : 0);
  const vdist = Math.max(0, PAD.y - r.y);
  let reward = 0;
  if(w.prevHDist!==null) reward += (w.prevHDist-hdist)*0.06;   // progress toward pad, horizontally
  if(w.prevVDist!==null) reward += (w.prevVDist-vdist)*0.01;
  w.prevHDist = hdist; w.prevVDist = vdist;
  reward += Math.cos(r.angle)*0.05;                  // upright bonus
  reward -= (r.boosters.bottom+r.boosters.top+r.boosters.left+r.boosters.right)*0.004; // fuel-use penalty
  reward -= 0.01;                                     // time penalty
  // strongly discourage tipping way over onto its side to "drift" toward the
  // pad using the main engine as sideways thrust - that is not a real landing
  if(Math.abs(r.angle) > 0.6){
    reward -= (Math.abs(r.angle)-0.6)*0.2;
  }

  // the closer to the ground, the more it should be slowing its descent
  if(vdist < 260 && r.vy > 40){
    reward -= (r.vy-40)*0.0025*(1 - vdist/260);
  }

  // dense "final approach" shaping: reward hovering over the pad, upright and
  // slow, while still airborne - pulls the policy toward the success funnel
  // instead of relying only on the rare terminal landing bonus to bootstrap.
  // The bonus tapers off the longer it lingers there without landing, so
  // camping in a good spot forever can't out-earn actually touching down.
  if(vdist < 220 && hdist < 40){
    w.approachSteps = (w.approachSteps||0) + 1;
    const speed = Math.hypot(r.vx,r.vy);
    const uprightness = Math.max(0, 1 - Math.abs(r.angle)/LAND_TILT_OK);
    const slowness = Math.max(0, 1 - speed/LAND_SPEED_OK);
    const loiterDecay = Math.max(0, 1 - w.approachSteps/90);
    reward += 0.12 * uprightness * slowness * (1 - vdist/220) * loiterDecay;
  } else {
    w.approachSteps = 0;
  }

  if(stepResult.done){
    if(stepResult.success){
      const speed = Math.hypot(r.vx,r.vy);
      reward += 140 + (1 - speed/LAND_SPEED_OK)*30 + (r.fuel/FUEL_MAX)*15;
    } else if(stepResult.reason==="tumbled"){
      reward -= 45;
    } else if(stepResult.reason==="missed pad"){
      reward -= 40;
    } else if(stepResult.reason==="timed out"){
      // ran out of time without ever landing - this must always read as a
      // clear failure, no matter how good a spot it was hovering in, or the
      // policy learns that camping near the pad forever is nearly as good
      // as actually landing on it.
      reward -= 35 + Math.min(15, hdist*0.05);
    } else { // hard landing (on pad but too fast/tilted) - penalty scales with how bad the impact was
      const speed = Math.hypot(r.vx,r.vy);
      const overSpeed = Math.max(0, speed/LAND_SPEED_OK - 1);
      const overTilt = Math.max(0, Math.abs(r.angle)/LAND_TILT_OK - 1);
      reward -= 15 + Math.min(40, (overSpeed+overTilt)*20);
    }
  }
  return reward;
}

/* =========================================================================
   PARALLEL WORKERS - many rockets train simultaneously each tick (this is
   what "many attempts at once" looks like); only worker 0 is ever drawn, so
   the screen still shows a single clean rocket while learning happens N-up.
   ========================================================================= */
function newWorker(){
  return {
    rocket: newRocket(),
    stepCount: 0,
    episodeReward: 0,
    prevHDist: null,
    prevVDist: null,
    approachSteps: 0,
    traj: { x:[], choice:[], pOld:[], v:[], r:[] }
  };
}
let workers = [];
for(let i=0;i<NUM_WORKERS;i++) workers.push(newWorker());

let attempts=0, successes=0, best=-Infinity, rewardHistory=[];
let running=false, speed=1;
let heroLastP = new Float64Array(OUT); // most recent policy output for worker 0, for the booster-power HUD
let trail = []; // worker 0's trajectory trail only
const settings = { showBoosterPct:true, showTrail:true, showFuel:true, infiniteFuel:false };

function resetLearning(){
  net = freshNet();
  gen++;
  attempts=0; successes=0; best=-Infinity; rewardHistory=[];
  difficulty=0; curriculumWindow=[]; recomputePad();
  pendingBatch=[]; pendingBatchSteps=0; successBuffer=[];
  workers = []; for(let i=0;i<NUM_WORKERS;i++) workers.push(newWorker());
  trail = [];
  saveAll(true);
  refreshHUD();
}

function resetWorker(w){
  w.rocket = newRocket();
  w.stepCount=0; w.episodeReward=0; w.prevHDist=null; w.prevVDist=null; w.approachSteps=0;
  w.traj = { x:[], choice:[], pOld:[], v:[], r:[] };
}

// The task is left-right symmetric (nothing about the physics or reward
// prefers one side), but the pad only ever sits to the right of the start
// point, so the policy only ever sees "pad is to the right" data directly.
// A network can get unlucky early and lock onto a confidently wrong
// direction, and - because bigger nets + multi-epoch PPO updates converge
// faster - it can lock in before enough corrective experience arrives to
// fix it. Mirroring every collected episode left-right (flipping which
// physical booster is "left" vs "right") gives the network an explicit,
// exactly-balanced counter-example for free every single time, which
// makes that kind of one-sided collapse essentially impossible. Reward
// values are unaffected by the mirror (nothing in the reward function
// depends on the sign of x or angle), so adv/ret carry over unchanged.
function mirrorRecord(record){
  const n = record.x.length;
  const mx = new Array(n), mc = new Array(n), mp = new Array(n);
  for(let t=0;t<n;t++){
    const s = record.x[t];
    mx[t] = Float64Array.from([-s[0], s[1], -s[2], s[3], -s[4], s[5], -s[6], s[7], s[8], s[9], s[11], s[10]]);
    const ch = record.choice[t];
    mc[t] = [ch[0], ch[1]===1?2:(ch[1]===2?1:0)];
    const p = record.pOld[t];
    mp[t] = Float64Array.from([p[0],p[1],p[2], p[3],p[5],p[4]]);
  }
  return { x:mx, choice:mc, pOld:mp, adv:record.adv, ret:record.ret };
}

function finishWorkerEpisode(w, stepResult, isHero){
  attempts++;
  if(stepResult.success) successes++;
  if(w.episodeReward>best) best = w.episodeReward;
  rewardHistory.push({r:w.episodeReward, s:stepResult.success});
  if(rewardHistory.length>300) rewardHistory.shift();

  const {adv, ret} = computeGAE(w.traj);
  const record = { x:w.traj.x, choice:w.traj.choice, pOld:w.traj.pOld, adv, ret };
  pendingBatch.push(record);
  pendingBatch.push(mirrorRecord(record));
  pendingBatchSteps += w.traj.r.length*2;
  if(stepResult.success) pushSuccessBuffer(record);

  updateCurriculum(stepResult.success);

  if(pendingBatchSteps >= BATCH_MIN_STEPS){
    runPpoUpdate();
    pendingBatch = []; pendingBatchSteps = 0;
    saveAll();
  }

  if(isHero){ showBanner(stepResult.success, stepResult.reason); trail = []; }
  refreshHUD();
  resetWorker(w);
}

/* =========================================================================
   SIMULATION TICK (one physics step per worker, called `speed` times/frame)
   ========================================================================= */
function tickWorker(w, isHero){
  if(!w.rocket.alive) return;
  const x = getState(w.rocket);
  const {p, v} = forward(x);
  const a = sampleActions(p);
  let res = physicsStep(w.rocket, a.booster);
  w.stepCount++;
  // fold the timeout into the same step's reward instead of ending the
  // episode with a synthetic result computeReward never actually sees -
  // otherwise a timed-out episode gets no terminal penalty at all
  if(!res.done && w.stepCount>=MAX_STEPS){
    res = {done:true, success:false, reason:"timed out"};
  }
  const r = computeReward(w, res);
  w.episodeReward += r;
  w.traj.x.push(x); w.traj.choice.push(a.choice); w.traj.pOld.push(p); w.traj.v.push(v); w.traj.r.push(r);

  if(isHero){
    heroLastP = p;
    trail.push({x:w.rocket.x, y:w.rocket.y});
    if(trail.length>220) trail.shift();
  }

  if(res.done){
    w.rocket.alive = false;
    finishWorkerEpisode(w, res, isHero);
  }
}

function tickAll(){
  for(let i=0;i<workers.length;i++) tickWorker(workers[i], i===0);
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio||1, 2.5);
let viewW=0, viewH=0;

function resize(){
  const holder = document.getElementById('canvasHolder');
  viewW = holder.clientWidth; viewH = holder.clientHeight;
  canvas.width = viewW*DPR; canvas.height = viewH*DPR;
  canvas.style.width = viewW+"px"; canvas.style.height = viewH+"px";
  resizeSpark();
}
window.addEventListener('resize', resize);

const stars = [];
for(let i=0;i<140;i++) stars.push({x:Math.random()*WORLD.w, y:Math.random()*WORLD.h*0.85, r:Math.random()*1.6+0.3, tw:Math.random()*Math.PI*2});

function draw(){
  const hero = workers[0].rocket;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // camera
  const camX = clamp(hero.x - viewW/2, 0, Math.max(0,WORLD.w-viewW));
  const camY = clamp(hero.y - viewH*0.42, 0, Math.max(0,WORLD.h-viewH));

  // sky
  const grd = ctx.createLinearGradient(0,0,0,viewH);
  grd.addColorStop(0,"#050614"); grd.addColorStop(0.6,"#0a0e24"); grd.addColorStop(1,"#141a33");
  ctx.fillStyle = grd; ctx.fillRect(0,0,viewW,viewH);

  ctx.save();
  ctx.translate(-camX,-camY);

  // stars
  const t = performance.now()/600;
  for(const st of stars){
    const tw = 0.5+0.5*Math.sin(t+st.tw);
    ctx.globalAlpha = 0.25+0.55*tw;
    ctx.fillStyle="#cfe4ff";
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ground
  ctx.fillStyle="#171c33";
  ctx.fillRect(0, WORLD.groundY, WORLD.w, WORLD.h-WORLD.groundY);
  ctx.fillStyle="#232a4d";
  ctx.fillRect(0, WORLD.groundY, WORLD.w, 6);
  for(let gx=0; gx<WORLD.w; gx+=46){
    ctx.strokeStyle="#2c3358"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx,WORLD.groundY+6); ctx.lineTo(gx-14,WORLD.h); ctx.stroke();
  }

  // pad
  const padGlow = 0.5+0.5*Math.sin(performance.now()/450);
  ctx.fillStyle="#0e2233";
  ctx.fillRect(PAD.x1-6, PAD.y-10, (PAD.x2-PAD.x1)+12, 16);
  ctx.fillStyle="#152a3d";
  ctx.fillRect(PAD.x1, PAD.y-8, PAD.x2-PAD.x1, 10);
  ctx.strokeStyle=`rgba(79,209,255,${0.5+0.4*padGlow})`;
  ctx.lineWidth=2.5;
  ctx.strokeRect(PAD.x1, PAD.y-8, PAD.x2-PAD.x1, 10);
  ctx.fillStyle="#4fd1ff";
  for(let lx=PAD.x1+10; lx<PAD.x2-5; lx+=22){
    ctx.globalAlpha = 0.35+0.5*Math.abs(Math.sin(performance.now()/300+lx));
    ctx.beginPath(); ctx.arc(lx, PAD.y-3, 2.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#7fe3ff";
  ctx.font="bold 13px -apple-system,Helvetica,Arial,sans-serif";
  ctx.textAlign="center";
  ctx.fillText("LANDING PAD", (PAD.x1+PAD.x2)/2, PAD.y-16);

  // trail
  if(settings.showTrail && trail.length>1){
    ctx.beginPath();
    for(let i=0;i<trail.length;i++){
      const pt = trail[i];
      if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y);
    }
    ctx.strokeStyle="rgba(124,92,255,0.55)";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  drawRocket(hero);

  ctx.restore();
}

// booster mount points, in the rocket's local frame - flames AND the visible
// nozzle pods are drawn from these same points so what fires is what you see
function boosterMounts(hw,hh){
  return {
    bottom: { x:0, y:hh,    dir:0 },
    top:    { x:0, y:-hh,   dir:Math.PI },
    left:   { x:-hw, y:0,   dir:-Math.PI/2 },
    right:  { x:hw, y:0,    dir:Math.PI/2 }
  };
}

function drawRocket(r){
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.angle);

  const hw=ROCKET_W/2, hh=ROCKET_H/2;
  const mounts = boosterMounts(hw,hh);

  // flames (draw behind body, per booster)
  drawFlame(mounts.bottom, r.boosters.bottom);
  drawFlame(mounts.top, r.boosters.top);
  drawFlame(mounts.left, r.boosters.left);
  drawFlame(mounts.right, r.boosters.right);

  // body
  const bodyGrad = ctx.createLinearGradient(-hw,0,hw,0);
  bodyGrad.addColorStop(0,"#c7ccdb"); bodyGrad.addColorStop(0.5,"#f4f6fb"); bodyGrad.addColorStop(1,"#9ba1b8");
  ctx.fillStyle = bodyGrad;
  roundRectPath(-hw,-hh,ROCKET_W,ROCKET_H,8);
  ctx.fill();
  ctx.strokeStyle="#3d4260"; ctx.lineWidth=1.4; ctx.stroke();

  // nose cone
  ctx.beginPath();
  ctx.moveTo(-hw, -hh);
  ctx.lineTo(0, -hh-16);
  ctx.lineTo(hw, -hh);
  ctx.closePath();
  ctx.fillStyle="#ff5c7a"; ctx.fill();
  ctx.stroke();

  // fins
  ctx.fillStyle="#4fd1ff";
  ctx.beginPath(); ctx.moveTo(-hw,hh-4); ctx.lineTo(-hw-11,hh+16); ctx.lineTo(-hw,hh-16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hw,hh-4); ctx.lineTo(hw+11,hh+16); ctx.lineTo(hw,hh-16); ctx.closePath(); ctx.fill();

  // window
  ctx.beginPath(); ctx.arc(0,-hh*0.15,6.5,0,7);
  ctx.fillStyle="#1a2740"; ctx.fill(); ctx.strokeStyle="#7fe3ff"; ctx.lineWidth=1.6; ctx.stroke();

  // stripe
  ctx.fillStyle="#7c5cff";
  ctx.fillRect(-hw, hh*0.35, ROCKET_W, 6);

  // booster nozzle pods - always visible so all 4 boosters read clearly,
  // lit up brightly whenever their booster is actively firing
  drawNozzle(mounts.bottom, 0, r.boosters.bottom);
  drawNozzle(mounts.top, Math.PI, r.boosters.top);
  drawNozzle(mounts.left, -Math.PI/2, r.boosters.left);
  drawNozzle(mounts.right, Math.PI/2, r.boosters.right);

  ctx.restore();
}

function drawNozzle(mount, dirAngle, active){
  ctx.save();
  ctx.translate(mount.x, mount.y);
  ctx.rotate(dirAngle);
  ctx.beginPath();
  ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.lineTo(4,9); ctx.lineTo(-4,9); ctx.closePath();
  ctx.fillStyle = active ? "#ffd580" : "#3a3f5c";
  ctx.fill();
  ctx.strokeStyle = active ? "#ffb347" : "#1c2038";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  if(active){
    ctx.shadowColor = "#ffb347"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fillStyle="#fff6e0"; ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawFlame(mount, active){
  if(!active) return;
  const px=mount.x, py=mount.y, dirAngle=mount.dir;
  const flick = 0.75+0.35*Math.sin(performance.now()/30+px+py);
  const len = (30+16*Math.random())*flick;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(dirAngle);
  ctx.shadowColor = "rgba(255,170,80,0.9)";
  ctx.shadowBlur = 16;
  const grad = ctx.createLinearGradient(0,0,0,len);
  grad.addColorStop(0,"rgba(255,255,255,0.98)");
  grad.addColorStop(0.3,"rgba(255,210,120,0.95)");
  grad.addColorStop(0.65,"rgba(255,150,60,0.85)");
  grad.addColorStop(1,"rgba(255,92,122,0)");
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(-8,2); ctx.lineTo(8,2); ctx.lineTo(0,len); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* banner */
let bannerTimer=null;
function showBanner(success, reason){
  const el = document.getElementById('banner');
  el.textContent = success ? "LANDED! ✅" : "CRASHED — " + reason;
  el.className = "banner show " + (success?"success":"crash");
  clearTimeout(bannerTimer);

}

/* =========================================================================
   SPARKLINE (learning progress)
   ========================================================================= */
const sparkCanvas = document.getElementById('spark');
const sctx = sparkCanvas.getContext('2d');
let sparkDPR = Math.min(window.devicePixelRatio||1,2.5);
function resizeSpark(){
  const w = sparkCanvas.clientWidth || sparkCanvas.parentElement.clientWidth;
  const h = sparkCanvas.clientHeight || 30;
  sparkCanvas.width = w*sparkDPR; sparkCanvas.height = h*sparkDPR;
}
function drawSpark(){
  const w = sparkCanvas.width/sparkDPR, h = sparkCanvas.height/sparkDPR;
  sctx.setTransform(sparkDPR,0,0,sparkDPR,0,0);
  sctx.clearRect(0,0,w,h);
  if(rewardHistory.length<2) return;
  const data = rewardHistory.slice(-120);
  const rs = data.map(d=>d.r);
  const mn = Math.min(...rs), mx = Math.max(...rs);
  const span = (mx-mn)||1;
  sctx.beginPath();
  data.forEach((d,i)=>{
    const px = i/(data.length-1)*w;
    const py = h - ((d.r-mn)/span)*(h-6) - 3;
    if(i===0) sctx.moveTo(px,py); else sctx.lineTo(px,py);
  });
  sctx.strokeStyle="#4fd1ff"; sctx.lineWidth=1.6; sctx.stroke();
  // success markers
  data.forEach((d,i)=>{
    if(d.s){
      const px = i/(data.length-1)*w;
      sctx.beginPath(); sctx.arc(px,4,2.1,0,7);
      sctx.fillStyle="#3ee08b"; sctx.fill();
    }
  });
}

/* =========================================================================
   HUD
   ========================================================================= */
function refreshHUD(){
  document.getElementById('statAttempt').textContent = attempts;
  document.getElementById('statSuccess').textContent = successes;
  document.getElementById('statRate').textContent = attempts? Math.round(successes/attempts*100)+"%" : "0%";
  document.getElementById('statBest').textContent = (best===-Infinity?0:best.toFixed(0));
  const last20 = rewardHistory.slice(-20);
  const avg = last20.length? (last20.reduce((s,d)=>s+d.r,0)/last20.length) : 0;
  document.getElementById('statAvg').textContent = avg.toFixed(1);
  document.getElementById('statDiff').textContent = Math.round(difficulty*100)+"%";
  document.getElementById('statGen').textContent = gen;
  drawSpark();
}

const boosterMeters = {
  bottom: document.querySelector('.bmeter[data-b="bottom"]'),
  top: document.querySelector('.bmeter[data-b="top"]'),
  left: document.querySelector('.bmeter[data-b="left"]'),
  right: document.querySelector('.bmeter[data-b="right"]')
};
// policy output index for each booster: axial group is [none,bottom,top], lateral is [none,left,right]
const boosterPIndex = { bottom:1, top:2, left:GROUPN+1, right:GROUPN+2 };

function updateBoosterHud(){
  if(!settings.showBoosterPct) return;
  const heroBoosters = workers[0].rocket.boosters;
  for(const name in boosterMeters){
    const el = boosterMeters[name];
    const pct = Math.round((heroLastP[boosterPIndex[name]]||0)*100);
    el.querySelector('i').style.width = pct+"%";
    el.querySelector('b').textContent = pct+"%";
    el.classList.toggle('firing', !!heroBoosters[name]);
  }
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
function frame(){
  if(running){
    for(let i=0;i<speed;i++){ tickAll(); }
  }
  draw();
  document.getElementById('statReward').textContent = workers[0].episodeReward.toFixed(1);
  if(settings.showFuel) document.getElementById('statFuel').textContent = Math.round(workers[0].rocket.fuel/FUEL_MAX*100)+"%";
  updateBoosterHud();
  requestAnimationFrame(frame);
}

/* --- settings panel --- */
const SETTINGS_KEY = "rocketLandingAI_settings_v1";
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return;
    Object.assign(settings, JSON.parse(raw));
  }catch(e){}
}
function applySettingsToUI(){
  document.getElementById('optBoosterPct').checked = settings.showBoosterPct;
  document.getElementById('optTrail').checked = settings.showTrail;
  document.getElementById('optFuel').checked = settings.showFuel;
  document.getElementById('optInfiniteFuel').checked = settings.infiniteFuel;
  document.getElementById('boosterHud').hidden = !settings.showBoosterPct;
  document.getElementById('fuelChip').hidden = !settings.showFuel;
}
